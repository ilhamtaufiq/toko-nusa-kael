services:
  nusa-kael:
    build: .
    container_name: nusa-kael
    restart: unless-stopped
    # Tidak memakai port host: Coolify meneruskan domain ke port 8080 container
    expose:
      - "8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Isi ADMIN_PASSWORD (min. 8 karakter) di file .env}
      # Midtrans (QRIS). Kosongkan untuk menonaktifkan QRIS. Pakai server key sandbox dulu.
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_API_BASE: ${MIDTRANS_API_BASE:-https://api.sandbox.midtrans.com}
      # Gateway GoPay (service internal, tidak dibuka ke publik)
      GATEWAY_URL: http://gateway:3100
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Isi GATEWAY_SECRET (min. 32 karakter) di file .env}
      DATABASE_URL: mysql://${DB_USER:-nusa}:${DB_PASSWORD:?Isi DB_PASSWORD di file .env}@db:3306/${DB_NAME:-nusa_kael}
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: nusa-kael-gateway
    restart: unless-stopped
    # Tidak ada ports: gateway hanya bisa dihubungi dari service nusa-kael di jaringan Docker
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Isi GATEWAY_SECRET (min. 32 karakter) di file .env}
      GOPAY_MERCHANT_ID: ${GOPAY_MERCHANT_ID:-}
      GOPAY_STATIC_QRIS: ${GOPAY_STATIC_QRIS:-}
    volumes:
      - gateway_data:/data

  db:
    image: mysql:8.4
    container_name: nusa-kael-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nusa_kael}
      MYSQL_USER: ${DB_USER:-nusa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - nusa_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  nusa_db:
  gateway_data:
